# GeneralDataPlatform

services:
  # -- PostgreSQL --
  postgres:
    image: postgres:16-alpine
    container_name: gdp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gdp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -- Redis --
  redis:
    image: redis:7-alpine
    container_name: gdp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # -- pgAdmin (optional, for dev) --
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gdp-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gdp.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      - postgres

  # -- MinIO (object storage for component bundles) --
  minio:
    image: minio/minio:latest
    container_name: gdp-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    volumes:
      - minio_data:/data

  # -- Backend API --
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gdp-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      GDP_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/gdp
      GDP_REDIS_URL: redis://redis:6379/0
      GDP_CELERY_BROKER_URL: redis://redis:6379/1
      GDP_CELERY_RESULT_BACKEND: redis://redis:6379/2
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # -- Celery Worker --
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gdp-celery
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      GDP_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/gdp
      GDP_REDIS_URL: redis://redis:6379/0
      GDP_CELERY_BROKER_URL: redis://redis:6379/1
      GDP_CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      - backend
      - redis
    volumes:
      - ./backend:/app
    command: >
      celery -A app.workers.celery_app worker --loglevel=info

  # -- Celery Beat (scheduler) --
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gdp-celery-beat
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      GDP_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/gdp
      GDP_REDIS_URL: redis://redis:6379/0
      GDP_CELERY_BROKER_URL: redis://redis:6379/1
      GDP_CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      - backend
      - redis
    volumes:
      - ./backend:/app
    command: >
      celery -A app.workers.celery_app beat --loglevel=info

volumes:
  pgdata:
  minio_data:
